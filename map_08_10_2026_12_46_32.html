var markersList = [];
function renderMarkers() {
    markersList.forEach(function(mObj){map.removeLayer(mObj.marker);});
    markersList=[];
    let listContainer=document.getElementById('pointsListContainer');
    listContainer.innerHTML='';
    rawData.forEach(function(item,index){
        var marker=L.marker([item[0],item[1]],{icon:custom3DPin}).addTo(map);
        var popupContent='<div class="popup-content"><b>'+escapeHtml(item[2])+'</b><br>Координати: '+escapeHtml(item[3])+'<br><button class="popup-zoom-btn" onclick="selectPointOnly('+index+')">Вибрати</button></div>';
        marker.bindPopup(popupContent);
        markersList.push({index:index,marker:marker});
        let div=document.createElement('div');
        div.className='point-item';
        div.innerHTML='<input type="checkbox" data-index="'+index+'"><span title="'+escapeHtml(item[2])+'">'+(index+1)+'. '+escapeHtml(item[2])+' ('+escapeHtml(item[3])+')</span>';
        div.querySelector('span').onclick=function(){marker.openPopup();};
        listContainer.appendChild(div);
    });
}
function escapeHtml(value) {
    return String(value).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];});
}
function selectPointOnly(index) {
    let checkbox=document.querySelector('.points-list input[type="checkbox"][data-index="'+index+'"]');
    if(checkbox) checkbox.checked=true;
    map.closePopup();
}
function togglePanel() {
    let panel=document.getElementById('controlPanel');
    let lockBtn=document.getElementById('lockBtn');
    if(!isAuthenticated) {
        let decoded=JSON.parse(atob(encodedConfig));
        let inputPass=prompt('Введіть пароль адміністратора для керування точками:');
        if(inputPass===null) return;
        if(inputPass!==decoded.pass) {alert('Невірний пароль!');return;}
        isAuthenticated=true;
        lockBtn.innerHTML='🔓';
    }
    panel.classList.toggle('active');
}
function toggleSelectAll() {
    let checkboxes=document.querySelectorAll('.points-list input[type="checkbox"]');
    let allChecked=Array.from(checkboxes).every(function(cb){return cb.checked;});
    checkboxes.forEach(function(cb){cb.checked=!allChecked;});
}
async function deleteSelectedPoints() {
    let checkboxes=document.querySelectorAll('.points-list input[type="checkbox"]:checked');
    if(checkboxes.length===0) {alert('Виберіть хоча б одну точку для видалення!');return;}
    if(!confirm('Видалити вибрані точки ('+checkboxes.length+' шт.) назавжди для всіх користувачів?')) return;
    let decoded=JSON.parse(atob(encodedConfig));
    let indicesToRemove=Array.from(checkboxes).map(function(cb){return parseInt(cb.getAttribute('data-index'));}).sort(function(a,b){return b-a;});
    indicesToRemove.forEach(function(index){rawData.splice(index,1);});
    renderMarkers();
    let apiUrl='https://api.github.com/repos/'+decoded.repo+'/contents/'+decoded.fileName;
    let delBtn=document.querySelector('.delete-selected-btn');
    try {
        delBtn.innerText='⏳ Збереження на GitHub...';
        delBtn.disabled=true;
        let getRes=await fetch(apiUrl,{headers:{'Authorization':'Bearer '+decoded.token,'Accept':'application/vnd.github+json'}});
        let fileData=await getRes.json();
        if(!getRes.ok) throw new Error(fileData.message || 'Не вдалося отримати файл з GitHub');
        let sha=fileData.sha;
        let currentHtml=new TextDecoder().decode(Uint8Array.from(atob(fileData.content.replace(/\n/g,'')),function(c){return c.charCodeAt(0);}));
        let oldRawDataMatch=currentHtml.match(/var rawData = ([\s\S]*?);\n/);
        if(!oldRawDataMatch) throw new Error('Не знайдено rawData у HTML.');
        let newRawDataStr='var rawData = '+JSON.stringify(rawData)+';\n';
        let updatedHtml=currentHtml.replace(oldRawDataMatch[0],newRawDataStr);
        let encodedContent=btoa(unescape(encodeURIComponent(updatedHtml)));
        let putRes=await fetch(apiUrl,{method:'PUT',headers:{'Authorization':'Bearer '+decoded.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Delete markers and update map',content:encodedContent,sha:sha})});
        let putJson=await putRes.json();
        if(!putRes.ok) throw new Error(putJson.message || putRes.statusText);
        for(let sec=60;sec>0;sec--){delBtn.innerText='⏳ Публікація ('+sec+'с)';await new Promise(function(r){setTimeout(r,1000);});}
        location.reload();
    } catch(err) {
        alert('Помилка збереження: '+err.message);
        delBtn.innerText='🗑️ Видалити вибрані';
        delBtn.disabled=false;
    }
}
renderMarkers();
</script>
</body>
</html>
